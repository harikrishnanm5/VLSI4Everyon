<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OpenProcess3D Viewer</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #1a1a1a;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      #app {
        width: 100%;
        height: 100%;
        position: relative;
      }
      #canvas-container {
        width: 100%;
        height: 100%;
      }
      #info-overlay {
        position: absolute;
        top: 12px;
        left: 12px;
        color: #e0e0e0;
        font-size: 13px;
        background: rgba(20, 20, 20, 0.75);
        backdrop-filter: blur(4px);
        padding: 8px 14px;
        border-radius: 6px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        pointer-events: none;
        user-select: none;
      }
      #error-overlay {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        color: #ff6b6b;
        font-size: 14px;
        background: rgba(30, 10, 10, 0.9);
        border: 1px solid #ff6b6b;
        padding: 16px 24px;
        border-radius: 8px;
        display: none;
        max-width: 80%;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="canvas-container"></div>
      <div id="info-overlay">OpenProcess3D Viewer</div>
      <div id="error-overlay"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
